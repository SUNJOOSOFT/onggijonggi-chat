name: ogjg-chat

services:
  caddy:
    image: caddy:2.9-alpine
    container_name: infra-caddy
    # 기본 설치는 caddy 없이 http://localhost:3010 으로 쓴다(INSTALL.md). HTTPS가 필요하면
    # .env에 COMPOSE_PROFILES=caddy 를 넣어 이 서비스를 켠다(전용 설치 문서는 준비 중).
    profiles:
      - caddy
    networks:
      app-net:
      # 다른 compose 스택(portainer 등)을 이 caddy 뒤에 붙이기 위한 공용 네트워크.
      # external이라 caddy를 켤 때 `docker network create proxy-net`이 한 번 필요하다.
      proxy-net:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddyfile이 {$CADDY_*_DOMAIN:...} 자리에서 읽는 값. 비워두면 .localhost 기본 주소를 쓴다.
      CADDY_APP_DOMAIN:  ${CADDY_APP_DOMAIN:-app.localhost}
      CADDY_API_DOMAIN:  ${CADDY_API_DOMAIN:-api.localhost}
      CADDY_AUTH_DOMAIN: ${CADDY_AUTH_DOMAIN:-auth.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: unless-stopped
    # libseccomp가 오래된(2.3.x 등) 호스트에서는 postgres:16-alpine이 쓰는 최신 syscall이
    # 기본 seccomp 프로필에 막혀 initdb가 EPERM("Operation not permitted")으로 실패한다.
    # 호스트 libseccomp를 갱신했다면 이 옵션은 제거해도 된다.
    security_opt:
      - seccomp=unconfined
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-appdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: infra-keycloak
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # 최초 기동 때 realm·client·역할·계정을 자동 생성한다(INSTALL.md 3단계).
      - ./config/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
    environment:
      KC_DB:              postgres
      KC_DB_URL:          jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME:     ${POSTGRES_USER:-appuser}
      KC_DB_PASSWORD:     ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED:    "true"
      # Keycloak이 생성할 외부 URL — 브라우저가 가는 앞단(로그인 화면·iss 클레임) 주소다.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-https://auth.localhost}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED:  "true"
      # config/realm-app.json 안의 ${...} 자리를 채우는 값들.
      # 반드시 `${VAR}` 형태여야 한다 — `${env.VAR}`는 치환되지 않고 기동이 실패한다.
      KEYCLOAK_REALM:         ${KEYCLOAK_REALM:-app-realm}
      KEYCLOAK_CLIENT_ID:     ${KEYCLOAK_CLIENT_ID:-ogjg-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      PUBLIC_FRONTEND_URL:    ${PUBLIC_FRONTEND_URL:-https://app.localhost}
      APP_USER:               ${APP_USER:-appuser}
      APP_USER_PASSWORD:      ${APP_USER_PASSWORD}
    # 이미 있는 realm은 건너뛰므로(IGNORE_EXISTING) 재시작해도 계정이 지워지지 않는다.
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: infra-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ${LITELLM_CONFIG_FILE:-./config/litellm_config.yaml}:/app/config.yaml:ro
    # 호스트에서 도는 모델(Ollama 등)에 닿기 위한 이름. Docker Desktop(Windows·macOS)은
    # 기본 제공하지만 리눅스의 도커 엔진에는 없어서 직접 매핑해 준다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY:   ${LITELLM_SALT_KEY}
      # 프리셋(config/litellm_config*.yaml)이 os.environ/... 으로 읽는 값들의 합집합이다.
      # 지금 쓰는 프리셋이 읽는 것만 실제로 쓰인다 — 나머지는 빈 값이어도 기동에 지장이 없다.
      LLM_API_KEY:        ${LLM_API_KEY:-}
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      OLLAMA_API_BASE:    ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
      VLLM_API_BASE:      ${VLLM_API_BASE:-http://host.docker.internal:8000/v1}
      STORE_MODEL_IN_DB:  "False"
      DATABASE_URL:       postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@postgres:5432/litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  bff:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    image: ${BFF_IMAGE:-ogjg-chat/backend-api:local}
    container_name: backend-api
    restart: unless-stopped
    ports:
      # 컨테이너 내부 server.port도 8090 — 로컬 개발과 포트 번호를 통일한다.
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # discovery(issuer-uri) 대신 jwk-set-uri(내부 도커 DNS, 항상 도달 가능)로 키를 직접 조회하고,
      # iss 클레임은 APP_SECURITY_PUBLIC_ISSUER(브라우저가 보는 공개 주소)와 별도로 비교한다.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-app-realm}/protocol/openid-connect/certs
      APP_SECURITY_PUBLIC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-app-realm}
      # 협업 스레드의 다른 참가자 표시 이름을 Keycloak Admin API로 조회하는 데 쓴다(이슈 #128) — 로그인에
      # 쓰는 것과 같은 ogjg-client 서비스 계정이고, realm-app.json이 view-users 권한을 부여해둔다.
      APP_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      APP_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-app-realm}
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SPRING_AI_OPENAI_BASE_URL:            http://litellm:4000
      SPRING_AI_OPENAI_API_KEY:             ${LITELLM_MASTER_KEY}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:  ${LLM_MODEL:-gemini-3.6-flash}
      APP_LLM_GATEWAY_URL:                  http://litellm:4000
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:3010}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy

  nextjs:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # frontend/lib/api/config.ts가 읽는 변수명과 반드시 일치해야 함 (다르면 조용히 목업 라우트로 폴백됨)
        NEXT_PUBLIC_BFF_BASE_URL: ${PUBLIC_BFF_URL:-http://localhost:8090}
    image: ${FRONTEND_IMAGE:-ogjg-chat/frontend-nextjs:local}
    container_name: frontend-nextjs
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      # 서버 컴포넌트가 BFF를 부를 때 쓰는 내부 주소(lib/api/config.ts).
      BFF_INTERNAL_URL:     http://bff:8090
      NEXT_PUBLIC_BFF_BASE_URL: ${PUBLIC_BFF_URL:-http://localhost:8090}
      NEXTAUTH_URL:         ${NEXTAUTH_URL:-http://localhost:3010}
      NEXTAUTH_SECRET:      ${NEXTAUTH_SECRET}
      # 컨테이너/리버스프록시 뒤에서 Auth.js(next-auth v5)가 요청 Host를 신뢰하도록.
      # 없으면 세션·signin 호출마다 UntrustedHost 에러가 난다.
      AUTH_TRUST_HOST:      "true"
      KEYCLOAK_ISSUER:      ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-app-realm}
      # 서버에서 직접 부르는 구간(discovery·토큰 교환·갱신)은 도커 내부 주소로 간다.
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-app-realm}
      KEYCLOAK_CLIENT_ID:   ${KEYCLOAK_CLIENT_ID:-ogjg-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    healthcheck:
      # 루트('/')는 미들웨어 인증 보호라 로그인으로 리다이렉트된다.
      # matcher에서 제외된 정적 자산(/favicon.ico)으로 서버 응답만 확인한다.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/favicon.ico"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    depends_on:
      bff:
        condition: service_healthy

  document-worker:
    build:
      context: ../worker/doc
      dockerfile: Dockerfile
    image: ogjg-worker-doc:local
    container_name: worker-doc
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_API_KEY: ${DOCUMENT_WORKER_INTERNAL_API_KEY}
      SEAWEED_FILER_URL: http://seaweedfs-filer:8888
      SEAWEED_ROOT_PREFIX: ${DOCUMENT_WORKER_SEAWEED_ROOT_PREFIX:-documents}
      MAX_REQUEST_BYTES: ${DOCUMENT_WORKER_MAX_REQUEST_BYTES:-1048576}
      MAX_OUTPUT_BYTES: ${DOCUMENT_WORKER_MAX_OUTPUT_BYTES:-26214400}
      MAX_OPERATIONS: ${DOCUMENT_WORKER_MAX_OPERATIONS:-500}
      RENDER_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_RENDER_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${DOCUMENT_WORKER_LOG_LEVEL:-INFO}
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-net
      - document-worker-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-master
    command: master -ip=seaweedfs-master
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-volume
    command: volume -ip=seaweedfs-volume -mserver=seaweedfs-master:9333 -dir=/data
    restart: unless-stopped
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - document-worker-seaweed-volume:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweedfs-volume:8080/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-filer
    command: filer -ip=seaweedfs-filer -master=seaweedfs-master:9333 -defaultStoreDir=/data
    restart: unless-stopped
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    volumes:
      - document-worker-seaweed-filer:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweedfs-filer:8888/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

networks:
  app-net:
    driver: bridge
  proxy-net:
    external: true
  document-worker-net:
    internal: true

volumes:
  postgres-data:
    driver: local
  caddy_data:
  caddy_config:
  document-worker-seaweed-volume:
  document-worker-seaweed-filer:
