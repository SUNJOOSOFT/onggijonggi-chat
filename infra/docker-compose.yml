name: ogjg-chat

services:
  caddy:
    image: caddy:2.9-alpine
    container_name: infra-caddy
    # 기본 설치는 caddy 없이 http://localhost:3010 으로 쓴다(INSTALL.md). HTTPS가 필요하면
    # .env에 COMPOSE_PROFILES=caddy 를 넣어 이 서비스를 켠다(전용 설치 문서는 준비 중).
    profiles:
      - caddy
    networks:
      app-net:
      # 다른 compose 스택(portainer 등)을 이 caddy 뒤에 붙이기 위한 공용 네트워크.
      # external이라 caddy를 켤 때 `docker network create proxy-net`이 한 번 필요하다.
      proxy-net:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddyfile이 {$CADDY_*_DOMAIN:...} 자리에서 읽는 값. 비워두면 .localhost 기본 주소를 쓴다.
      CADDY_APP_DOMAIN:  ${CADDY_APP_DOMAIN:-app.localhost}
      CADDY_API_DOMAIN:  ${CADDY_API_DOMAIN:-api.localhost}
      CADDY_AUTH_DOMAIN: ${CADDY_AUTH_DOMAIN:-auth.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: unless-stopped
    # libseccomp가 오래된(2.3.x 등) 호스트에서는 postgres:16-alpine이 쓰는 최신 syscall이
    # 기본 seccomp 프로필에 막혀 initdb가 EPERM("Operation not permitted")으로 실패한다.
    # 호스트 libseccomp를 갱신했다면 이 옵션은 제거해도 된다.
    security_opt:
      - seccomp=unconfined
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-appdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: infra-keycloak
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # 최초 기동 때 realm·client·역할·계정을 자동 생성한다(INSTALL.md 3단계).
      - ./config/realm-app.json:/opt/keycloak/data/import/realm-app.json:ro
    environment:
      KC_DB:              postgres
      KC_DB_URL:          jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME:     ${POSTGRES_USER:-appuser}
      KC_DB_PASSWORD:     ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED:    "true"
      # Keycloak이 생성할 외부 URL — 브라우저가 가는 앞단(로그인 화면·iss 클레임) 주소다.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-https://auth.localhost}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED:  "true"
      # config/realm-app.json 안의 ${...} 자리를 채우는 값들.
      # 반드시 `${VAR}` 형태여야 한다 — `${env.VAR}`는 치환되지 않고 기동이 실패한다.
      KEYCLOAK_REALM:         ${KEYCLOAK_REALM:-app-realm}
      KEYCLOAK_CLIENT_ID:     ${KEYCLOAK_CLIENT_ID:-ogjg-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_BFF_CLIENT_ID:     ${KEYCLOAK_BFF_CLIENT_ID:-ogjg-bff}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      PUBLIC_FRONTEND_URL:    ${PUBLIC_FRONTEND_URL:-https://app.localhost}
      APP_USER:               ${APP_USER:-appuser}
      APP_USER_PASSWORD:      ${APP_USER_PASSWORD}
    # client secret이 빈 값이면 Keycloak은 빈 secret을 그대로 받아들여, 누구나 client_secret=(빈 값)으로 토큰을 받는다(#326, 실측).
    # 그래서 예전 .env처럼 값이 비어 있으면 아무도 모르는 무작위 값으로 채운 뒤 기동한다. realm을 처음 만들 때만 쓰이는 값이라
    # 이미 있는 realm에는 영향이 없다. 무작위로 채워졌다면 관리 콘솔에서 secret을 재발급해 .env에 넣어야 로그인·관리 조회가 된다.
    entrypoint:
      - /bin/bash
      - -c
      - |
        fill() {
          if [ -z "$${!1}" ]; then
            read -r a < /proc/sys/kernel/random/uuid; read -r b < /proc/sys/kernel/random/uuid
            export "$$1=$${a//-/}$${b//-/}"
            echo "[경고] $$1 이(가) 비어 있어 무작위 값으로 채웠다 — infra/.env에 값을 넣는다(INSTALL.md)"
          fi
        }
        fill KEYCLOAK_CLIENT_SECRET
        fill KEYCLOAK_BFF_CLIENT_SECRET
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    # 이미 있는 realm은 건너뛰므로(IGNORE_EXISTING) 재시작해도 계정이 지워지지 않는다.
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: infra-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ${LITELLM_CONFIG_FILE:-./config/litellm_config.yaml}:/app/config.yaml:ro
    # 호스트에서 도는 모델(Ollama 등)에 닿기 위한 이름. Docker Desktop(Windows·macOS)은
    # 기본 제공하지만 리눅스의 도커 엔진에는 없어서 직접 매핑해 준다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY:   ${LITELLM_SALT_KEY}
      # 프리셋(config/litellm_config*.yaml)이 os.environ/... 으로 읽는 값들의 합집합이다.
      # 지금 쓰는 프리셋이 읽는 것만 실제로 쓰인다 — 나머지는 빈 값이어도 기동에 지장이 없다.
      LLM_API_KEY:        ${LLM_API_KEY:-}
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      OLLAMA_API_BASE:    ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
      VLLM_API_BASE:      ${VLLM_API_BASE:-http://host.docker.internal:8000/v1}
      STORE_MODEL_IN_DB:  "False"
      DATABASE_URL:       postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@postgres:5432/litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "4"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  casbin:
    image: casbin/casbin-server:v1.19.0
    container_name: infra-casbin
    # 권한 판정 서버. .env에 COMPOSE_PROFILES=casbin(과 SPRING_PROFILE=prod,casbin)을 넣어야 켜진다.
    profiles:
      - casbin
    restart: unless-stopped
    # gRPC API에 인증이 없어 포트를 밖으로 열지 않는다. bff만 app-net 안에서 casbin:50051로 부른다.
    # 메모리만 쓰고 저장소가 없다 — 재시작하면 bff가 DB에서 규칙을 다시 넣는다.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-net

  elasticsearch:
    build:
      context: ./elasticsearch
    image: ogjg-chat/elasticsearch-nori:local
    container_name: infra-elasticsearch
    # RAG 검색용. 메모리를 많이 써서 .env에 COMPOSE_PROFILES=elasticsearch 를 넣어야 켜진다.
    profiles:
      - elasticsearch
    restart: unless-stopped
    # 보안(인증·TLS)을 끈 채라 호스트의 127.0.0.1에만 연다 — 로컬 개발에서 bff가 localhost:9200으로 붙는다.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - app-net

  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    container_name: infra-searxng
    # 웹 검색 공급자(선택). .env에 COMPOSE_PROFILES=searxng와 WEB_SEARCH_PROVIDER=searxng를 넣어야 쓴다.
    profiles:
      - searxng
    restart: unless-stopped
    # 포트를 밖으로 열지 않는다. bff만 app-net 안에서 searxng:8080으로 부른다. 외부 검색엔진으로 나가는 통신은 필요하다.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - app-net

  bff:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    image: ${BFF_IMAGE:-ogjg-chat/backend-api:local}
    container_name: backend-api
    restart: unless-stopped
    ports:
      # 컨테이너 내부 server.port도 8090 — 로컬 개발과 포트 번호를 통일한다.
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      # v0.2에서 올릴 때 한 번만 절체 migration 앞 버전으로 정한다(INSTALL.md「v0.2에서 올릴 때」). 평소에는 latest(끝까지 적용)다.
      SPRING_FLYWAY_TARGET: ${SPRING_FLYWAY_TARGET:-latest}
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # discovery(issuer-uri) 대신 jwk-set-uri(내부 도커 DNS, 항상 도달 가능)로 키를 직접 조회하고,
      # iss 클레임은 APP_SECURITY_PUBLIC_ISSUER(브라우저가 보는 공개 주소)와 별도로 비교한다.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-app-realm}/protocol/openid-connect/certs
      APP_SECURITY_PUBLIC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-app-realm}
      # 표시 이름·사람 목록·초대 검색·권한 변경 감사를 Keycloak Admin API로 읽는 BFF 전용 클라이언트(#326).
      # realm-app.json이 view-users·view-events·view-realm만 준다. 이 secret은 nextjs에 넘기지 않는다 —
      # 로그인 클라이언트(KEYCLOAK_CLIENT_SECRET)는 프론트에도 있어 관리 권한을 붙이지 않는다.
      APP_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      APP_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-app-realm}
      APP_KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_BFF_CLIENT_ID:-ogjg-bff}
      APP_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      SPRING_AI_OPENAI_BASE_URL:            http://litellm:4000
      SPRING_AI_OPENAI_API_KEY:             ${LITELLM_MASTER_KEY}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:  ${LLM_MODEL:-gemini-3.6-flash}
      APP_LLM_GATEWAY_URL:                  http://litellm:4000
      APP_DOCUMENT_WORKER_URL: http://document-worker:8100
      APP_DOCUMENT_INTERNAL_API_KEY: ${DOCUMENT_WORKER_INTERNAL_API_KEY}
      # 방 문서 검색(#344). elasticsearch 프로필을 켜지 않으면 ES가 없어 검색 결과가 UNAVAILABLE일 뿐 BFF는 정상 기동한다(depends_on 없음).
      # 질문 임베딩은 ETL과 같은 엔드포인트·모델이어야 한다. RAG_REWRITE_MODEL을 비우면 그 대화의 모델로 후속 질문을 다시 쓴다.
      APP_RAG_ELASTICSEARCH_URL: http://elasticsearch:9200
      APP_RAG_EMBEDDING_URL: ${EMBEDDING_URL:-}
      APP_RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      APP_RAG_REWRITE_MODEL: ${RAG_REWRITE_MODEL:-}
      APP_RAG_SEARCH_API_ENABLED: ${RAG_SEARCH_API_ENABLED:-true}
      # AI 턴의 웹 검색·웹 읽기 도구. 기본 공급자 duckduckgo는 키가 필요 없지만 비공식이라 차단될 수 있다.
      # searxng로 바꾸려면 COMPOSE_PROFILES에 searxng를 넣고 WEB_SEARCH_PROVIDER=searxng로 둔다.
      APP_WEB_ENABLED: ${WEB_TOOLS_ENABLED:-true}
      APP_WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      APP_WEB_SEARXNG_URL: http://searxng:8080
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:3010}
    volumes:
      # 조직 구조 설정. 두 파일을 모두 마운트하고 프로필이 고른다(application-prod / application-casbin.properties).
      # 기본(prod)은 Tenant 하나만 만드는 default 파일 — 모든 대화가 놓일 곳이 있어야 대화를 만들 수 있다.
      # casbin 프로필을 함께 켜면(SPRING_PROFILE=prod,casbin) 팀·규칙이 있는 workspace-setup.yml을 읽는다.
      - ./config/workspace-setup.yml:/config/workspace-setup.yml:ro
      - ./config/workspace-setup.default.yml:/config/workspace-setup.default.yml:ro
      # 사람의 팀·직급(username,team,rank). casbin 프로필에서만 읽는다. 폴더째 마운트한다 — 파일 하나만 마운트하면 편집기가
      # 파일을 바꿔치기해 저장할 때 컨테이너가 옛 내용을 본다. 고친 뒤 casbin을 재시작하면 다음 판정 때 다시 적재된다.
      - ./config/members:/config/members:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy

  nextjs:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # frontend/lib/api/config.ts가 읽는 변수명과 반드시 일치해야 함 (다르면 조용히 목업 라우트로 폴백됨)
        NEXT_PUBLIC_BFF_BASE_URL: ${PUBLIC_BFF_URL:-http://localhost:8090}
    image: ${FRONTEND_IMAGE:-ogjg-chat/frontend-nextjs:local}
    container_name: frontend-nextjs
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      # 서버 컴포넌트가 BFF를 부를 때 쓰는 내부 주소(lib/api/config.ts).
      BFF_INTERNAL_URL:     http://bff:8090
      NEXT_PUBLIC_BFF_BASE_URL: ${PUBLIC_BFF_URL:-http://localhost:8090}
      NEXTAUTH_URL:         ${NEXTAUTH_URL:-http://localhost:3010}
      NEXTAUTH_SECRET:      ${NEXTAUTH_SECRET}
      # 컨테이너/리버스프록시 뒤에서 Auth.js(next-auth v5)가 요청 Host를 신뢰하도록.
      # 없으면 세션·signin 호출마다 UntrustedHost 에러가 난다.
      AUTH_TRUST_HOST:      "true"
      KEYCLOAK_ISSUER:      ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-app-realm}
      # 서버에서 직접 부르는 구간(discovery·토큰 교환·갱신)은 도커 내부 주소로 간다.
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-app-realm}
      KEYCLOAK_CLIENT_ID:   ${KEYCLOAK_CLIENT_ID:-ogjg-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    healthcheck:
      # 루트('/')는 미들웨어 인증 보호라 로그인으로 리다이렉트된다.
      # matcher에서 제외된 정적 자산(/favicon.ico)으로 서버 응답만 확인한다.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/favicon.ico"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    depends_on:
      bff:
        condition: service_healthy

  document-worker:
    build:
      context: ../worker/doc
      dockerfile: Dockerfile
    image: ogjg-worker-doc:local
    container_name: worker-doc
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_ENV: ${APP_ENV:-production}
      INTERNAL_API_KEY: ${DOCUMENT_WORKER_INTERNAL_API_KEY}
      SEAWEED_FILER_URL: http://seaweedfs-filer:8888
      SEAWEED_ROOT_PREFIX: ${DOCUMENT_WORKER_SEAWEED_ROOT_PREFIX:-documents}
      MAX_REQUEST_BYTES: ${DOCUMENT_WORKER_MAX_REQUEST_BYTES:-1048576}
      MAX_OUTPUT_BYTES: ${DOCUMENT_WORKER_MAX_OUTPUT_BYTES:-26214400}
      MAX_OPERATIONS: ${DOCUMENT_WORKER_MAX_OPERATIONS:-500}
      RENDER_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_RENDER_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${DOCUMENT_WORKER_LOG_LEVEL:-INFO}
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-net
      - document-worker-net

  # 06·DOCUMENT — 방 문서 인제스천 ETL 워커(#340). 등록된 방 문서를 추출·청킹·임베딩해 Elasticsearch에 적재한다.
  # Elasticsearch 없이는 할 일이 없어 같은 프로필로 켠다(COMPOSE_PROFILES=elasticsearch). 포트를 열지 않는다.
  # 스키마는 bff의 Flyway가 만들므로 bff가 뜬 뒤에 시작한다. EMBEDDING_URL이 비면 작업을 가져가지 않는다.
  etl:
    build:
      context: ../backend
      dockerfile: etl/Dockerfile
    image: ${ETL_IMAGE:-ogjg-chat/etl:local}
    container_name: backend-etl
    profiles:
      - elasticsearch
    restart: unless-stopped
    # 처리 중 회차를 최대 8초 기다린 뒤 놓아주고 Spring을 닫는다. 기본 10초면 그 전에 강제 종료될 수 있다.
    stop_grace_period: 20s
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ETL_WORKER_URL: http://document-worker:8100
      APP_ETL_WORKER_API_KEY: ${DOCUMENT_WORKER_INTERNAL_API_KEY}
      APP_ETL_ELASTICSEARCH_URL: http://elasticsearch:9200
      APP_ETL_EMBEDDING_URL: ${EMBEDDING_URL:-}
      APP_ETL_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    depends_on:
      bff:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      document-worker:
        condition: service_healthy
    networks:
      - app-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-master
    command: master -ip=seaweedfs-master
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-volume
    command: volume -ip=seaweedfs-volume -mserver=seaweedfs-master:9333 -dir=/data
    restart: unless-stopped
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - document-worker-seaweed-volume:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweedfs-volume:8080/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.80
    container_name: infra-seaweed-filer
    command: filer -ip=seaweedfs-filer -master=seaweedfs-master:9333 -defaultStoreDir=/data
    restart: unless-stopped
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    volumes:
      - document-worker-seaweed-filer:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://seaweedfs-filer:8888/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [document-worker-net]

networks:
  app-net:
    driver: bridge
  proxy-net:
    external: true
  document-worker-net:
    internal: true

volumes:
  postgres-data:
    driver: local
  elasticsearch-data:
  caddy_data:
  caddy_config:
  document-worker-seaweed-volume:
  document-worker-seaweed-filer:
