# 기본 조직 구조 설정 — 권한 기능(casbin 프로필)을 켜지 않은 기본 배포가 쓴다.
#
# 모든 대화(1:1·협업방)는 워크스페이스에 놓여야 한다. 조직 구조가 없는 기본 배포에서도 대화를 만들 수 있게,
# 고객사(Tenant) 하나만 만든다. ROOT·COMMON은 Tenant를 만들 때 자동으로 생기므로 선언하지 않는다 — 모든 대화가 COMMON에 놓인다.
# 팀·직급·워크스페이스가 없으므로 권한 판정은 하지 않는다(app.rbac.enforce=false).
#
# 권한 기능을 켜면(SPRING_PROFILE=prod,casbin) 이 파일 대신 workspace-setup.yml을 읽는다(INSTALL.md「권한 기능 켜기」).
# **tnn_key는 그 파일과 같은 ogjg로 둔다** — 그래야 파일이 바뀌어도 Tenant가 둘로 늘지 않고 같은 Tenant에 팀·노드가 더해진다.
# Tenant가 둘 이상이면 권한 기능이 꺼진 배포는 새 대화를 만들 수 없고(503), 기존 Thread 절체 사전 검증도 중단된다.
# 서버를 켤 때만 읽는다 — 이 파일을 바꾸면 bff를 다시 켜야 반영된다.
reconcile:
  enabled: false

tenants:
  - tnn_key: ogjg
    name: 기본
    status: ACTIVE
    org_units: []
    nodes: []
    grants: []
