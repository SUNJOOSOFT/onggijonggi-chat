# v0.3 RBAC bootstrap 선언 예시 — 이 파일은 예시일 뿐 실제로 읽히지 않는다.
#
# 실제 설정은 배포 환경에 마운트하고 환경변수 APP_RBAC_BOOTSTRAP_CONFIG_PATH(app.rbac.bootstrap-config-path)로
# 경로를 준다. 경로가 비어 있으면 bootstrap은 아무것도 만들지 않는다.
#
# 규칙 요약
#  - ROOT·COMMON은 Tenant를 만들 때 자동으로 만들어지므로 선언하지 않는다(node_key root·common은 예약).
#  - 노드의 parent는 root 또는 이 설정에서 선언한 다른 노드의 node_key다. COMMON 아래에는 노드를 둘 수 없다.
#  - 모든 ACTIVE org_unit은 node: common, role: VIEWER 부여를 선언해야 한다(없으면 개인 채팅도 못 쓴다).
#  - ROOT 바로 아래의 최상위 노드마다 ADMIN 부여가 하나 이상 있어야 한다(ROOT에는 부여할 수 없다).
#  - 설정이 이 규칙을 하나라도 어기면 bootstrap 전체가 실행되지 않는다.
#  - 이미 있는 리소스의 상태(status)·노드 kind·부모가 선언과 다르면 그 Tenant는 drift로 판정돼 fail-closed로 표시된다.
#    표시명(name)만 다른 것은 경고만 남긴다. 부여는 drift가 아니다(빠진 부여는 만들고, 설정에서 뺀 부여는 그대로 둔다).
#  - reconcile은 enabled와 dpl_id가 모두 있을 때만 선언과의 차이를 적용하고, 같은 dpl_id는 Tenant마다 한 번만 적용한다.
#    dpl_id는 배포마다 새로 만든다(예: 날짜-순번).
reconcile:
  enabled: false
  dpl_id: "2026-01-01-01"

tenants:
  - tnn_key: acme            # 불변 slug. token의 tenant claim과 같은 값이다
    name: ACME               # 표시명(바꿔도 권한에는 영향이 없다)
    status: ACTIVE           # ACTIVE | INACTIVE
    org_units:
      - key: sales           # 불변 slug. token의 org_units claim과 같은 값이다
        name: 영업본부
        status: ACTIVE
      - key: dev
        name: 개발본부
        status: ACTIVE
    nodes:
      - node_key: sales-hq
        kind: ORG            # ORG | WORK (동작 차이 없는 표시 분류이며 만든 뒤 바꿀 수 없다)
        parent: root         # root면 최상위 노드
        name: 영업본부
        status: ACTIVE
      - node_key: domestic
        kind: WORK
        parent: sales-hq
        name: 국내영업
        status: ACTIVE
      - node_key: dev-hq
        kind: ORG
        parent: root
        name: 개발본부
        status: ACTIVE
    grants:
      # 모든 ACTIVE org_unit의 COMMON VIEWER 부여(필수)
      - { org_unit: sales, role: VIEWER, node: common }
      - { org_unit: dev, role: VIEWER, node: common }
      # 최상위 노드마다 ADMIN 부여(필수)
      - { org_unit: sales, role: ADMIN, node: sales-hq }
      - { org_unit: dev, role: ADMIN, node: dev-hq }
      # 그 밖의 부여는 자유롭게 선언한다(role: VIEWER | CONTRIBUTOR | ADMIN)
      - { org_unit: sales, role: CONTRIBUTOR, node: domestic }
