name: Close Issue on Hotfix Merge

on:
  # fork PR(pull_request)은 저장소·조직 설정과 무관하게 GITHUB_TOKEN이 강제로 읽기 전용이라
  # gh issue close가 매번 실패한다(#268) — pull_request_target은 base 저장소 토큰 권한을
  # 그대로 쓴다. 이 워크플로는 PR 코드를 체크아웃하지 않고 gh 명령만 호출하므로, 신뢰할 수
  # 없는 코드를 실행하는 pull_request_target 특유의 위험이 없다.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: PR 본문의 Closes #를 읽어 이슈를 닫는다
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issues=$(grep -oiE 'closes[[:space:]]+#[0-9]+' <<< "$PR_BODY" | grep -oE '[0-9]+' || true)
          if [ -z "$issues" ]; then
            echo "본문에 Closes #가 없다 — 닫을 이슈 없음"
            exit 0
          fi
          for n in $issues; do
            gh issue close "$n" --repo "${{ github.repository }}" \
              --comment "PR #${PR_NUMBER}에서 main에 머지되어 닫는다."
          done
