name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # .githooks/pre-commit이 커밋 시점에 돌리는 것과 같은 Node 검사들 — 마이그레이션 SQL의
  # DB 식별자·설계 불변식·Flyway 버전, 그리고 자바 클래스 헤더. 판정이 갈리지 않게 훅과 같은 스크립트를
  # 쓴다. 훅을 설치하지 않았거나(`git config core.hooksPath .githooks`) 우회한 커밋은
  # 여기서 걸린다. 검사 자체가 가벼워서(수 초) 잡을 나누지 않는다 — 나누면 러너마다
  # checkout·Node 설치에 20~30초를 더 쓰게 된다.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node는 Active LTS를 쓴다. 22(Jod)는 2025-10부터 maintenance라 보안 패치만 나오고
      # 2027-04에 끝난다 — 24(Krypton)는 2026-10까지 Active LTS, EOL 2028-04다.
      # frontend 잡도 같은 버전을 쓴다(아래).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 훅은 `--staged`(인덱스)를 읽지만 CI 체크아웃에는 스테이징된 내용이 없다.
      # 그래서 마이그레이션 파일 전체를 인자로 넘긴다.
      - name: 용어집 검사
        run: node scripts/validate-glossary.mjs backend/common/src/main/resources/db/migration/*.sql

      - name: 설계 불변식 검사
        run: node scripts/validate-invariants.mjs backend/common/src/main/resources/db/migration/*.sql

      - name: Flyway migration 검사 테스트
        run: node --test scripts/validate-flyway-migrations.test.mjs scripts/flyway-migration.test.mjs

      - name: Flyway migration 버전 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/validate-flyway-migrations.mjs --changed-from "${{ github.event.pull_request.base.sha }}"
          else
            node scripts/validate-flyway-migrations.mjs --tracked
          fi

      - name: 자바 클래스 헤더 검사 테스트
        run: node --test scripts/validate-java-class-header.test.mjs

      - name: 자바 클래스 헤더 검사
        run: node scripts/validate-java-class-header.mjs --tracked

  # backend — 컴파일·테스트 실패를 머지 전에 막는다.
  # 이 잡이 없어서 존재하지 않는 클래스를 참조하는 코드가 그대로 머지됐고(#38),
  # 테스트 전체가 컴파일되지 않는 상태를 뒤늦게 고쳐야 했다(#43).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spring Boot 4 Gradle 플러그인은 JVM 17 이상에서만 로드된다.
      # build.gradle의 toolchain 설정은 컴파일·테스트용 JDK만 정하므로 이걸 대신하지 못한다 —
      # 데몬 JVM이 그보다 낮으면 플러그인을 해석하는 단계에서 먼저 죽는다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # gradlew가 실행 권한 없이(100644) 커밋돼 있어 체크아웃 직후에는 바로 돌릴 수 없다.
      # backend/api/Dockerfile도 같은 이유로 chmod를 한다.
      - name: gradlew 실행 권한 부여
        working-directory: backend
        run: chmod +x gradlew

      - name: 빌드·테스트
        working-directory: backend
        run: ./gradlew build --no-daemon

      # ThreadDumpOnStallExtension(이슈 #107)이 실패한 테스트에 한해서만 남기는 스레드 덤프.
      # 평소엔 디렉터리 자체가 안 생기므로 if-no-files-found: ignore로 조용히 건너뛴다.
      - name: 스레드 덤프 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-dumps
          path: backend/api/build/test-results/thread-dumps/
          if-no-files-found: ignore
          retention-days: 7

  flyway-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyway_verify
          POSTGRES_USER: flyway_verify
          POSTGRES_PASSWORD: flyway_verify
        options: >-
          --health-cmd "pg_isready -U flyway_verify -d flyway_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: gradlew 실행 권한 부여
        working-directory: backend
        run: chmod +x gradlew

      - name: 빈 PostgreSQL Flyway 전체 적용 검증
        working-directory: backend
        env:
          FLYWAY_VERIFY_JDBC_URL: jdbc:postgresql://localhost:5432/flyway_verify
          FLYWAY_VERIFY_USERNAME: flyway_verify
          FLYWAY_VERIFY_PASSWORD: flyway_verify
        run: ./gradlew :api:verifyFlywayMigrations --no-daemon

      - name: 기존 1:1 대화 이관 fixture 검증
        working-directory: backend
        env:
          FLYWAY_VERIFY_JDBC_URL: jdbc:postgresql://localhost:5432/flyway_verify
          FLYWAY_VERIFY_USERNAME: flyway_verify
          FLYWAY_VERIFY_PASSWORD: flyway_verify
        run: ./gradlew :api:verifyDirectChatMigrationFixture --no-daemon

      - name: Hibernate 매핑↔PostgreSQL 스키마 검증
        working-directory: backend
        env:
          FLYWAY_VERIFY_JDBC_URL: jdbc:postgresql://localhost:5432/flyway_verify
          FLYWAY_VERIFY_USERNAME: flyway_verify
          FLYWAY_VERIFY_PASSWORD: flyway_verify
        run: ./gradlew :api:verifyHibernateMapping --no-daemon

      - name: Thread 삭제 cascade 검증 (idempotency 키 포함, #251)
        working-directory: backend
        env:
          FLYWAY_VERIFY_JDBC_URL: jdbc:postgresql://localhost:5432/flyway_verify
          FLYWAY_VERIFY_USERNAME: flyway_verify
          FLYWAY_VERIFY_PASSWORD: flyway_verify
        run: ./gradlew :api:verifyThreadDeleteCascade --no-daemon

      - name: PostgreSQL 로그
        if: failure()
        run: docker logs ${{ job.services.postgres.id }}

  # frontend — 타입 검사가 본체다.
  # #38 같은 "존재하지 않는 것을 참조" 부류는 biome 린트가 잡지 못하고 tsc가 잡는다.
  # 린트는 그다음 순서로 돌린다(형식·규칙 위반은 성격이 다른 문제라 원인 파악이 쉬워진다).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest는 node 런타임에서 돈다 — `bun run test`는 vitest 바이너리의 node shebang을 보고
      # 시스템 node에 넘긴다. node가 없으면 bun이 자기 런타임으로 fallback하고, 그때 zod(CJS)
      # interop이 깨져 `z.object`가 undefined가 된다. runner 이미지에 우연히 있는 node에
      # 기대지 않도록 여기서 못을 박는다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # package-lock.json은 package.json과 어긋나 있어 npm으로는 설치되지 않는다.
      # 실제 빌드(frontend/Dockerfile)와 같은 경로인 bun.lock을 쓴다.
      - name: 의존성 설치
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: 타입 검사
        working-directory: frontend
        run: bunx tsc --noEmit

      # 로직 회귀는 tsc도 biome도 잡지 못한다 — vitest가 그 몫이다.
      # `test` 스크립트는 `vitest run`이라 watch로 매달리지 않는다.
      - name: 테스트
        working-directory: frontend
        run: bun run test

      - name: 린트
        working-directory: frontend
        run: bun run lint:check
