# 06·DOCUMENT — 방 문서 인제스천 ETL 워커(#340) 기본 설정.
# 도커 배포 시엔 infra/docker-compose.yml의 환경변수가 덮어쓴다.

spring.application.name=etl
# 사용자 요청을 받지 않는다 — 포트를 열지 않는다(common이 WebFlux를 끌어와도 서버를 띄우지 않는다).
spring.main.web-application-type=none
# 처리 스레드는 데몬이다. 웹 서버가 없으니 JVM이 살아 있도록 명시한다(스케줄러 스레드에 우연히 기대지 않는다).
spring.main.keep-alive=true

spring.datasource.url=jdbc:postgresql://localhost:5442/appdb
spring.datasource.username=appuser
spring.datasource.password=
# 스키마는 BFF의 Flyway가 만든다. 엔티티도 쓰지 않으므로 Hibernate가 스키마를 건드리지 않게 둔다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 원본 읽기 — BFF와 같은 문서 워커 내부 API·key.
app.etl.worker.url=http://localhost:8100
app.etl.worker.api-key=
app.etl.elasticsearch.url=http://localhost:9200
# 임베딩(OpenAI 호환 /v1/embeddings). 비우면 워커가 작업을 가져가지 않고 경고만 남긴다.
app.etl.embedding.url=
app.etl.embedding.model=bge-m3
# 그 밖의 값(기본값은 EtlProperties): concurrency(2), poll-delay(2s), lease(10m), retry-delays(30s,2m,10m,30m),
# request-timeout(60s), elasticsearch.bulk-size(200), embedding.batch-size(32)
# 지난 회차 청크 정리·회차 보충 주기
#app.etl.sweep-delay=30s
# 처리가 꺼져 있을 때(임베딩 주소 없음·차원 불일치) 경고를 다시 남기는 주기
#app.etl.disabled-warn-delay=5m
# 다시 만들기(#348): 운영자 요청·설정 변경을 보는 주기, 청크 수 대조(자동 복구) 주기, 대체된 회차 청크를 지우기 전 유예
#app.etl.rebuild-delay=30s
#app.etl.verify-delay=10m
#app.etl.superseded-grace=2m

# 스케줄 작업(정리·다시 만들기 대조)을 한 스레드에 몰지 않는다 — Elasticsearch가 느리면 정리 작업이 대조·운영자 요청을 막는다.
spring.task.scheduling.pool.size=2

# 방 문서 태깅(#362). 문서 본문 전체를 보내므로 사내 LLM 서버(OpenAI 호환 /v1/chat/completions)만 둔다. 비우면 태깅하지 않는다.
#app.etl.tagging.url=
#app.etl.tagging.model=
# 그 밖의 값(기본값은 TaggingProperties): categories(비우면 7개 기본 목록), timeout(120s), max-tokens(1024), max-keywords(10), summary-max-chars(200),
# single-call-chars(40000), part-chars(12000), max-parts(20), batch(20), retry-first-delay(1m), retry-delay(1h),
# permanent-retry-delay(7d), idle-delay(30s). 태그 검색 인덱스 이름은 app.etl.elasticsearch.tag-index(thr_doc_tag_v1)·tag-alias(thr_doc_tag)
