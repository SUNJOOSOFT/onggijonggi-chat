plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	// 03·CORE — casbin-server(gRPC) 클라이언트를 src/main/proto/casbin.proto에서 생성한다.
	id 'com.google.protobuf' version '0.10.0'
}

dependencies {
	implementation project(':common')

	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

	// 04·DATA — 스키마 마이그레이션(PostgreSQL + Flyway).
	// Flyway는 JDBC로 동작하고 기동 시 1회만 돈다. 런타임 퍼시스턴스를 JPA로 갈지 R2DBC로 갈지는
	// 아직 미결이므로 여기서는 DataSource와 Flyway만 붙이고 ORM은 넣지 않는다.
	// Boot 4는 자동구성이 모듈로 분리돼 flyway-core만으로는 기동 시 마이그레이션이 돌지 않는다.
	// spring-boot-flyway가 자동구성을 제공한다(없으면 조용히 아무것도 안 함 — 실제로 겪었음).
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// 03·CORE — 세션별 대화 이력 저장. ORM은 설계가 JPA/Hibernate로
	// 명시해 JPA vs R2DBC 선택을 확정했다. WebFlux(리액티브)+JPA(블로킹) 조합은
	// PersistingChatStreamService가 boundedElastic 오프로딩으로 다룬다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 03·CORE — Casbin 판정 서버(casbin-server) gRPC 클라이언트. 공식 Java 클라이언트가 없어 proto에서 생성한다.
	// grpc-netty-shaded는 Netty를 안에 숨긴 판이다 — WebFlux가 쓰는 Netty(Boot BOM이 4.2로 고정)와 부딪히지 않게 한다.
	// protobuf-java는 gRPC 1.84가 기준으로 쓰는 3.25.x에 맞춘다(Boot BOM은 protobuf를 관리하지 않는다).
	implementation platform('io.grpc:grpc-bom:1.84.0')
	implementation 'io.grpc:grpc-netty-shaded'
	implementation 'io.grpc:grpc-protobuf'
	implementation 'io.grpc:grpc-stub'
	implementation 'com.google.protobuf:protobuf-java:3.25.9'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.6'
	testImplementation 'org.testcontainers:postgresql:1.20.6'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// JPA 붙은 뒤 테스트 컨텍스트 기동에 DataSource가 필요해져 추가(Flyway는 계속 꺼둠 — 아래 참고).
	// Postgres 마이그레이션 SQL(uuid/jsonb 등)을 그대로 H2에 돌리면 방언 차이로 깨지므로, 스키마는
	// Hibernate ddl-auto가 엔티티 기준으로 즉석 생성한다(스키마 정합성이 아니라 서비스 로직 검증 목적).
	testRuntimeOnly 'com.h2database:h2'
}

tasks.register('verifyFlywayMigrations', JavaExec) {
	group = 'verification'
	description = 'Applies every Flyway migration to the configured empty PostgreSQL database.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.onggijonggi.api.migration.FlywayMigrationVerifier'
}

tasks.register('verifyDirectChatMigrationFixture', JavaExec) {
	group = 'verification'
	description = 'Verifies the legacy direct-chat migration against PostgreSQL fixtures.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.onggijonggi.api.migration.DirectChatMigrationFixtureVerifier'
}

tasks.register('verifyHibernateMapping', JavaExec) {
	group = 'verification'
	description = 'Validates that JPA entity mappings match the PostgreSQL schema Flyway applied.'
	dependsOn testClasses
	// 둘 다 같은 DB를 보는데 Gradle은 그 사실을 모른다 — CI는 yml 스텝 순서로 이미 보장되지만,
	// 로컬에서 두 task를 한 명령으로 부를 때도 순서가 깨지지 않게 명시한다.
	mustRunAfter tasks.named('verifyFlywayMigrations')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.onggijonggi.api.migration.HibernateMappingVerifier'
}

tasks.register('verifyThreadDeleteCascade', JavaExec) {
	group = 'verification'
	description = 'Verifies DIRECT/COLLAB Thread deletion succeeds with idempotency key rows present (#251).'
	dependsOn testClasses
	// verifyFlywayMigrations가 적용을 끝낸 같은 DB 위에서 fixture를 심고 지운다.
	mustRunAfter tasks.named('verifyFlywayMigrations')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.onggijonggi.api.migration.ThreadDeleteCascadeVerifier'
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.25.9'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.84.0'
		}
	}
	generateProtoTasks {
		all()*.plugins {
			// javax.annotation.Generated를 붙이지 않는다 — Java 17에는 그 클래스가 없다.
			grpc { option '@generated=omit' }
		}
	}
}
