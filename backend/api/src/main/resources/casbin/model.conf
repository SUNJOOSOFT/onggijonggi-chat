# Casbin ABAC 판정 모델. casbin-server의 NewEnforcer에 modelText로 넘긴다(CasbinPolicy.MODEL_RESOURCE).
#
# 사람의 팀·직급 속성은 p2(subject, org_unit, rank)로 넣는다. 판정식은 p만 보고 p2는 조회(GetFilteredNamedPolicy)에만 쓴다.
# 판정 요청의 r.sub는 그 사람의 속성 JSON이다: {"OrgUnit":"<org_unit.id>","Rank":<서열 숫자>} — bff가 p2에서 읽어 만든다.
# 규칙(p.sub_rule)은 식이다: r.sub.OrgUnit == '<org_unit.id>' (팀 규칙, wrk_grn) / r.sub.Rank <= N (직급 서열 규칙, rank_grn)
#
# casbin-server v1.19.0에서 확인한 것:
# - NewEnforcer에 enableAcceptJsonRequest=true를 줘야 한다. README의 "ABAC::" 접두어 방식은 eval()로 푸는 정책 식의
#   속성 이름을 바꾸지 않아 전부 오류가 난다.
# - Rank는 JSON 숫자로 넘겨야 한다. 문자열 "4"는 비교에서 오류가 난다.
# - 미배정자를 Rank 0으로 넘기면 서열 규칙이 열린다. 미배정자는 판정을 묻지 않는다.
# - 판정식에 쓰지 않는 p2를 넣어도 p 판정 결과는 같다. p2 첫 칸에 식 모양의 값이 있어도 평가하지 않는다.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub_rule, obj, act
p2 = subject, org_unit, rank

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = eval(p.sub_rule) && r.obj == p.obj && r.act == p.act
