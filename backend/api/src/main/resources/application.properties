# bff 로컬 개발 기본 설정.
# 도커 배포 시엔 대부분 infra/docker-compose.yml의 환경변수가 이 값들을 덮어쓴다.
# 특정 서버 주소는 여기(커밋 파일)에 두지 않는다 — 실제 서버 주소는 application-local.properties에서
# 개인별로 오버라이드한다(템플릿: application-local.properties.example).

# --- 앱 기본 ---
spring.application.name=bff
server.port=8090
spring.config.import=optional:classpath:application-local.properties

# --- LiteLLM (Spring AI) ---
spring.ai.openai.base-url=http://localhost:4000/v1
# 화면에서 모델을 고르지 않았을 때 쓰는 기본값. 실제 호출은 요청의 modelId로 덮어쓴다.
spring.ai.openai.chat.options.model=gemini-3.6-flash
# 모델 목록 조회(GET /v1/models)용 게이트웨이 루트 주소. Spring AI의 base-url과 달리
# 경로가 붙지 않은 루트라 ModelCatalogService가 따로 읽는다.
app.llm.gateway-url=http://localhost:4000

# --- 03·CORE: 협업 채팅 AI ---
app.collab.ai.model=${spring.ai.openai.chat.options.model}
app.collab.ai.turn-timeout=120s
app.collab.ai.max-pending-per-room=20
# @AI 멘션 시 LLM에 넘길 과거 대화 문맥의 최대 메시지 개수(이슈 #100). 토큰 수가 아니라 개수로
# 제한한다 — 이 저장소에 토큰 계산 라이브러리가 없다.
app.collab.ai.max-context-messages=20

# --- 02·EDGE: CORS·JWT ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:3010
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/app-realm/protocol/openid-connect/certs
app.security.public-issuer=http://localhost:8081/realms/app-realm
app.security.expected-audience=ogjg-client

# --- 03·CORE: Keycloak Admin (다른 참가자 표시 이름 조회, 이슈 #128) ---
# jwk-set-uri와 같은 내부 도커 DNS를 쓰지만 admin API는 realm 밖(/admin/realms/{realm}) 경로라 루트를 따로 둔다.
app.keycloak.internal-url=http://localhost:8081
app.keycloak.realm=app-realm
# 로그인에 쓰는 것과 같은 client다 — expected-audience와 항상 같은 값을 가리킨다.
app.keycloak.admin.client-id=${app.security.expected-audience}
# 비밀번호는 application-local.properties 또는 APP_KEYCLOAK_ADMIN_CLIENT_SECRET로 주입 — 커밋 금지
app.keycloak.admin.client-secret=

# --- 02·EDGE: RateLimit ---
app.ratelimit.per-minute=20
app.ratelimit.window-seconds=60
# WS 핸드셰이크는 위와 다른 통에서 따로 센다(카운터·한도 모두 분리, WsSecurityConfig 참조).
# 흔한 경우 끊길 때마다 한 번이지만, 재연결이 계속 실패하면 백오프를 타고도 탭당 첫 1분에 9회까지 오른다.
app.ratelimit.ws-handshake-per-minute=30
# 연결 내 메시지도 또 다른 통이다(이슈 #74). 세는 단위는 연결이 아니라 sub — 연결 단위로 세면
# 소켓을 끊었다 붙이는 것만으로 초기화된다. 대화 중 연속 발화라 위 둘보다 넉넉하다.
app.ratelimit.ws-message-per-minute=60

# --- 04·DATA: PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5442/appdb
spring.datasource.username=appuser
# 비밀번호는 application-local.properties 또는 SPRING_DATASOURCE_PASSWORD로 주입 — 커밋 금지

# --- 03·CORE: JPA (스키마 변경은 Flyway로만, JPA는 직접 안 바꿈) ---
spring.jpa.hibernate.ddl-auto=none

# --- 04·DATA: Flyway ---
# 로컬 기본 프로파일은 항상 off — datasource.url을 실수로 서버로 설정한 채 기동해도
# Flyway가 운영 스키마를 건드리지 않도록 함. prod 프로파일(application-prod.properties)에서만 on.
spring.flyway.enabled=false

# --- Actuator ---
management.endpoints.web.exposure.include=health
