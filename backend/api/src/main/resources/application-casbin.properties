# casbin 프로필 — 권한 기능 전체 스위치. infra/.env에 SPRING_PROFILE=prod,casbin과 COMPOSE_PROFILES=casbin을 함께 넣어 켠다.
# 끄면 지금과 똑같이 동작한다(Casbin 서버 없음, 권한 판정 없음, 조직 구조 설정 없음).
app.rbac.enforce=true
# infra/docker-compose.yml이 infra/config/workspace-setup.yml을 이 경로에 읽기 전용으로 마운트한다.
app.rbac.workspace-setup-path=/config/workspace-setup.yml
# infra/docker-compose.yml의 casbin 서비스. 포트를 밖으로 열지 않아 app-net 안에서만 닿는다.
app.casbin.address=casbin:50051
# 사람의 팀·직급 속성 파일(CSV username,team,rank). infra/docker-compose.yml이 infra/config/members/ 폴더째 읽기 전용으로
# 마운트한다 — 파일 하나만 마운트하면 편집기가 파일을 바꿔치기할 때 컨테이너가 옛 내용을 본다. 고친 뒤 casbin을 재시작하면 반영된다.
app.rbac.members-path=/config/members/members.csv
