# 배포(prod) 프로파일 전용 오버라이드. infra/docker-compose.yml이 SPRING_PROFILES_ACTIVE=prod로 활성화한다.
spring.flyway.enabled=true
# 모든 대화는 Tenant의 워크스페이스에 놓여야 한다. 권한 기능(casbin)을 켜지 않은 기본 배포도 기본 Tenant 하나를 만들도록
# 조직 구조 설정을 읽는다. docker-compose가 infra/config/workspace-setup.default.yml을 이 경로에 마운트한다.
# casbin 프로필은 뒤에 붙여(SPRING_PROFILE=prod,casbin) 팀·규칙이 있는 /config/workspace-setup.yml로 덮어쓴다
# (application-casbin.properties). 프로필은 나중에 적은 것이 이긴다.
app.rbac.workspace-setup-path=/config/workspace-setup.default.yml
