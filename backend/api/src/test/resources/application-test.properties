# 테스트 전용 더미 값(프로필 "test"에서만 적용, 기본 application.properties 위에 덧붙는다).
# ChatModel은 FakeChatModelConfig로 대체되어 실제 네트워크를 타지 않으므로, spring-ai OpenAI
# 오토컨피그가 클라이언트를 만드는 데 필요한 자격만 채워주면 된다(진짜 키 아님).
spring.ai.openai.api-key=test-dummy-key

# 04·DATA — 테스트 컨텍스트에는 실제 Postgres가 없다. 현재 테스트는 02·EDGE(보안)·03·CORE(스트리밍·
# 세션저장) 대상이라 DB에 의존하는 두 가지를 끈다.
# - flyway: 기동 시 마이그레이션을 돌리며 연결을 시도해 컨텍스트가 아예 뜨지 않는다.
# - health.db: /actuator/health가 DB DOWN 때문에 503이 되어 allowsActuatorHealthWithoutToken 이 깨진다.
# 스키마·마이그레이션 정합성 검증이 필요해지면 Testcontainers 등 실제 Postgres를 붙인 별도 테스트로 다룬다.
spring.flyway.enabled=false
management.health.db.enabled=false

# 03·CORE — JPA가 붙으면서 컨텍스트 기동에 DataSource가 필요해졌다. Flyway는 위처럼 계속
# 꺼두고, H2 인메모리 DB 위에 Hibernate가 엔티티 기준으로 즉석 스키마를 만들게 한다(schema fidelity가
# 아니라 PersistingChatStreamService 등 서비스 로직 검증이 목적).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# RiskCheckBatchService(#28) — 테스트 컨텍스트에서 주기 스캔이 돌면 FakeChatModel을 예측 불가능한
# 시점에 호출해 다른 테스트와 간섭한다. 배치 자체의 동작은 유닛 테스트로 별도 검증한다.
app.collab.risk-check.enabled=false

# RoomSessionRegistry 퇴장 방송 유예(이슈 #198) — 운영 기본값(8s)을 그대로 쓰면 WS 통합 테스트가
# WsTestTimeouts.BLOCK(5s)보다 오래 기다리게 된다. 유예 로직 자체의 검증은
# RoomSessionRegistryTest가 더 짧은 값으로 결정적으로 한다.
app.collab.presence.leave-debounce=200ms
